[project]
name = "telegram-submission-bot"
version = "1.1.0"
description = "Telegram channel submission and review bot"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
